  <section id="contact" class="section section-contact">
    <div class="section-inner contact-inner">
        <div class="section-header center" data-reveal>
          <p class="section-kicker" data-i18n="contact.kicker">Contact</p>
          <h2 class="section-title" data-i18n="contact.title">Let’s Talk About Your Product’s Quality.</h2>
          <p class="section-subtitle" data-i18n="contact.subtitle">
            Share a few details about your product, and we’ll get back with a tailored
            quality perspective — not a generic sales pitch.
          </p>
        </div>
        <form id="contact-form" action="/contact-submit.php" method="post" novalidate data-reveal>
          <label class="visually-hidden" for="contact-name" data-i18n="contact.name">Name</label>
          <input type="text" id="contact-name" name="name" placeholder="Name" data-i18n-placeholder="contact.name" autocomplete="name" required maxlength="200" />

          <label class="visually-hidden" for="contact-email" data-i18n="contact.email">Email</label>
          <input type="email" id="contact-email" name="email" placeholder="Email" data-i18n-placeholder="contact.email" autocomplete="email" required maxlength="200" />

          <label class="visually-hidden" for="contact-company" data-i18n="contact.company">Company / Product</label>
          <input type="text" id="contact-company" name="company" placeholder="Company / Product" data-i18n-placeholder="contact.company" autocomplete="organization" maxlength="200" />

          <!-- Request type: CTA framework, Website Brief §IV. Options are the two approved CTA labels. -->
          <!-- DRAFT: needs approval (field label and default option) -->
          <label class="contact-field-label" for="contact-request" data-i18n="contact.requestType">Request type</label>
          <select id="contact-request" name="request_type">
            <option value="" data-i18n="contact.requestGeneral">General message</option>
            <option value="guided-vibe-test" data-i18n="contact.requestGuided">Run a Guided Vibe Test</option>
            <option value="bcq-requirement" data-i18n="contact.requestBcq">Discuss a Business Care Quality Requirement</option>
          </select>

          <label class="visually-hidden" for="contact-message" data-i18n="contact.message">Tell us briefly about your product and current challenges</label>
          <textarea id="contact-message" name="message" placeholder="Tell us briefly about your product and current challenges" data-i18n-placeholder="contact.message" maxlength="5000"></textarea>

          <div class="contact-hp" aria-hidden="true">
            <label for="contact-website">Website (leave blank)</label>
            <input type="text" id="contact-website" name="website" tabindex="-1" autocomplete="off" />
          </div>

          <button type="submit" class="btn btn-primary" data-i18n="contact.submit">Send Message</button>
          <p id="contact-status" class="contact-status" role="status" aria-live="polite" hidden></p>
        </form>
      <script>
        (function () {
          const form = document.getElementById('contact-form');
          if (!form || form.dataset.bound === '1') return;
          form.dataset.bound = '1';

          const submitBtn = form.querySelector('button[type="submit"]');
          const status = document.getElementById('contact-status');

          // Preselect the request type from ?request= (CTA framework destinations).
          const requestSelect = document.getElementById('contact-request');
          const requestParam = new URLSearchParams(window.location.search).get('request');
          if (requestSelect && requestParam) {
            Array.prototype.forEach.call(requestSelect.options, function (option) {
              if (option.value && option.value === requestParam) {
                requestSelect.value = requestParam;
              }
            });
          }

          const messages = {
            en: {
              submitting: 'Sending your message…',
              success: 'Thanks — we’ll be in touch within 1 business day.',
              validation: 'Please check your name and email and try again.',
              error: 'Sorry — we couldn’t send your message. Please email info@wewill.tech directly.'
            },
            ar: {
              submitting: 'جارٍ إرسال رسالتك…',
              success: 'شكرًا — سنعاود التواصل خلال يوم عمل واحد.',
              validation: 'يرجى التأكد من الاسم والبريد الإلكتروني والمحاولة مرة أخرى.',
              error: 'تعذّر إرسال رسالتك. يرجى مراسلة info@wewill.tech مباشرة.'
            }
          };

          function t(key, fallback) {
            const lang = document.documentElement.lang === 'ar' ? 'ar' : 'en';
            return (messages[lang] && messages[lang][key]) || fallback;
          }

          function setStatus(message, kind) {
            if (!status) return;
            status.textContent = message;
            status.hidden = false;
            status.classList.remove('is-success', 'is-error', 'is-loading');
            if (kind) status.classList.add('is-' + kind);
          }

          form.addEventListener('submit', function (e) {
            e.preventDefault();
            if (form.dataset.submitting === '1') return;

            const data = new FormData(form);
            const honeypot = (data.get('website') || '').toString().trim();
            if (honeypot !== '') {
              setStatus(t('success', 'Thanks — we’ll be in touch within 1 business day.'), 'success');
              form.reset();
              return;
            }

            form.dataset.submitting = '1';
            if (submitBtn) submitBtn.disabled = true;
            setStatus(t('submitting', 'Sending your message…'), 'loading');

            fetch(form.action, {
              method: 'POST',
              body: data,
              headers: { 'Accept': 'application/json' },
              credentials: 'same-origin'
            })
              .then(function (res) {
                return res.json().then(function (body) { return { ok: res.ok, body: body }; });
              })
              .then(function (result) {
                if (result.ok && result.body && result.body.ok) {
                  setStatus(t('success', 'Thanks — we’ll be in touch within 1 business day.'), 'success');
                  form.reset();
                } else if (result.body && result.body.error === 'validation') {
                  setStatus(t('validation', 'Please check your name and email and try again.'), 'error');
                } else {
                  setStatus(t('error', 'Sorry — we couldn’t send your message. Please email info@wewill.tech directly.'), 'error');
                }
              })
              .catch(function () {
                setStatus(t('error', 'Sorry — we couldn’t send your message. Please email info@wewill.tech directly.'), 'error');
              })
              .then(function () {
                form.dataset.submitting = '0';
                if (submitBtn) submitBtn.disabled = false;
              });
          });
        })();
      </script>
    </div>
  </section>
