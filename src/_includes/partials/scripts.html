  <script src="/assets/site.js"></script>
  <script>
    (function () {
      var root = document.documentElement;
      var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      // Hero entrance — trigger after first paint so the transition runs.
      if (reduced) {
        root.classList.add('is-loaded');
      } else {
        requestAnimationFrame(function () {
          requestAnimationFrame(function () { root.classList.add('is-loaded'); });
        });
      }

      // Apply per-child stagger index for [data-reveal-children] containers.
      var groups = document.querySelectorAll('[data-reveal-children]');
      groups.forEach(function (parent) {
        Array.prototype.forEach.call(parent.children, function (child, i) {
          child.style.setProperty('--reveal-i', i);
        });
      });

      var targets = document.querySelectorAll('[data-reveal], [data-reveal-children]');

      // Fallback: if reduced motion or no IO support, reveal everything immediately.
      if (reduced || !('IntersectionObserver' in window)) {
        targets.forEach(function (el) { el.classList.add('is-visible'); });
        return;
      }

      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) {
            entry.target.classList.add('is-visible');
            io.unobserve(entry.target);
          }
        });
      }, { threshold: 0.08, rootMargin: '0px 0px -40px 0px' });

      targets.forEach(function (el) { io.observe(el); });
    })();
  </script>
