<!-- CHAT WIDGET -->
  <div class="chat-widget" aria-live="polite">
    <div class="chat-panel" id="chat-panel">
      <div class="chat-panel-header">
        <div>
          <div class="chat-panel-title" data-i18n="chat.title">Chat with WE WILL</div>
          <div class="chat-panel-sub" data-i18n="chat.subtitle">Send us a quick message.</div>
        </div>
        <button class="chat-close" type="button" aria-label="Close chat">&times;</button>
      </div>
      <textarea id="chat-message" placeholder="Write your message here..." data-i18n-placeholder="chat.placeholder"></textarea>
      <div class="chat-actions">
        <button class="chat-btn chat-btn-wa" type="button" id="chat-send-wa" data-i18n="chat.whatsapp">💬 WhatsApp</button>
        <button class="chat-btn chat-btn-email" type="button" id="chat-send-email" data-i18n="chat.email">✉ Email</button>
      </div>
    </div>

  <button class="chat-toggle" type="button" aria-label="Open chat">
    💬
  </button>
</div>
