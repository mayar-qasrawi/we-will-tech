  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ial verify … <span style=\"color:#2EC478\">pass<\u002Fspan><\u002Fdiv>\n            <div style=\"animation:runRow 10s infinite;animation-delay:5.4s;opacity:0\"><span style=\"color:#4C6394\">▸<\u002Fspan> receipt <span style=\"color:#fff\">#VT-4821<\u002Fspan> · confidence <span style=\"color:#fff\">98.7%<\u002Fspan> <span style=\"color:#2EC478\">✓<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:2px\"><span style=\"color:#4C6394\">▸<\u002Fspan><span style=\"width:8px;height:15px;background:#7F92B8;display:inline-block;margin-left:6px;animation:runCaret 1.1s infinite\"><\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <div dir=\"ltr\" aria-hidden=\"true\" style=\"background:#0B1526;color:#F7F8FA;overflow:hidden;padding:13px 0;border-block:1px solid #0B1526\">\n    <div style=\"display:flex;width:max-content;animation:marquee 26s linear infinite\">\n      <div class=\"mono\" style=\"display:flex;gap:44px;padding-right:44px;font-size:12px;letter-spacing:.22em;text-transform:uppercase;white-space:nowrap\">\n        <span>Evidence, not claims <span style=\"color:#2E6BE6\">✓<\u002Fspan><\u002Fspan><span>الأدلة، لا الادعاءات <span style=\"color:#2E6BE6\">✓<\u002Fspan><\u002Fspan><span>Find → Fix → Verify → Ship <span style=\"color:#2E6BE6\">↺<\u002Fspan><\u002Fspan><span>Backed by receipts <span style=\"color:#2E6BE6\">✓<\u002Fspan><\u002Fspan><span>Evidence, not claims <span style=\"color:#2E6BE6\">✓<\u002Fspan><\u002Fspan><span>الأدلة، لا الادعاءات <span style=\"color:#2E6BE6\">✓<\u002Fspan><\u002Fspan><span>Find → Fix → Verify → Ship <span style=\"color:#2E6BE6\">↺<\u002Fspan><\u002Fspan><span>Backed by receipts <span style=\"color:#2E6BE6\">✓<\u002Fspan><\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"mono\" style=\"display:flex;gap:44px;padding-right:44px;font-size:12px;letter-spacing:.22em;text-transform:uppercase;white-space:nowrap\">\n        <span>Evidence, not claims <span style=\"color:#2E6BE6\">✓<\u002Fspan><\u002Fspan><span>الأدلة، لا الادعاءات <span style=\"color:#2E6BE6\">✓<\u002Fspan><\u002Fspan><span>Find → Fix → Verify → Ship <span style=\"color:#2E6BE6\">↺<\u002Fspan><\u002Fspan><span>Backed by receipts <span style=\"color:#2E6BE6\">✓<\u002Fspan><\u002Fspan><span>Evidence, not claims <span style=\"color:#2E6BE6\">✓<\u002Fspan><\u002Fspan><span>الأدلة، لا الادعاءات <span style=\"color:#2E6BE6\">✓<\u002Fspan><\u002Fspan><span>Find → Fix → Verify → Ship <span style=\"color:#2E6BE6\">↺<\u002Fspan><\u002Fspan><span>Backed by receipts <span style=\"color:#2E6BE6\">✓<\u002Fspan><\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <section id=\"problem\" style=\"max-width:1240px;margin:0 auto;padding:76px 24px 68px;scroll-margin-top:84px\">\n    <div class=\"reveal\" style=\"display:flex;align-items:baseline;gap:18px;flex-wrap:wrap;margin-bottom:12px\">\n      <span class=\"mono\" style=\"font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#2E6BE6\">01 — THE PROBLEM<\u002Fspan>\n    <\u002Fdiv>\n    <h2 class=\"disp reveal\" style=\"margin:0 0 22px;font-size:clamp(30px,4.6vw,54px);max-width:22ch\">\n      <span class=\"en\">Shipping is easy. <span style=\"color:transparent;-webkit-text-stroke:1.5px #0B1526\">Proving it works<\u002Fspan> is not.<\u002Fspan>\n      <span class=\"ar\">الإطلاق سهل. أمّا <span style=\"color:#2E6BE6\">إثبات أنه يعمل<\u002Fspan> فليس كذلك.<\u002Fspan>\n    <\u002Fh2>\n    <div style=\"border-top:1.5px solid #0B1526\">\n      <div class=\"reveal\" style=\"display:grid;grid-template-columns:minmax(56px,90px) 1fr 1.2fr;gap:20px;align-items:baseline;padding:26px 0;border-bottom:1px solid #E1E7F0\">\n        <span class=\"mono\" style=\"font-size:15px;color:#2E6BE6\">01<\u002Fspan>\n        <h3 style=\"margin:0;font-size:clamp(17px,2vw,21px);font-weight:700\"><span class=\"en\">Teams ship faster than they can QA<\u002Fspan><span class=\"ar\">الفرق تُطلق أسرع مما تستطيع اختباره<\u002Fspan><\u002Fh3>\n        <p style=\"margin:0;font-size:15px;line-height:1.6;color:#5A6A85\"><span class=\"en\">Bugs and unverified AI features reach real users before anyone catches them.<\u002Fspan><span class=\"ar\">تصل العيوب وميزات الذكاء الاصطناعي غير المُتحقَّقة إلى المستخدمين قبل اكتشافها.<\u002Fspan><\u002Fp>\n      <\u002Fdiv>\n      <div class=\"reveal\" style=\"display:grid;grid-template-columns:minmax(56px,90px) 1fr 1.2fr;gap:20px;align-items:baseline;padding:26px 0;border-bottom:1px solid #E1E7F0\">\n        <span class=\"mono\" style=\"font-size:15px;color:#2E6BE6\">02<\u002Fspan>\n        <h3 style=\"margin:0;font-size:clamp(17px,2vw,21px);font-weight:700\"><span class=\"en\">Real QA needs expert testers<\u002Fspan><span class=\"ar\">الجودة الحقيقية تحتاج خبراء اختبار<\u002Fspan><\u002Fh3>\n        <p style=\"margin:0;font-size:15px;line-height:1.6;color:#5A6A85\"><span class=\"en\">Functional, UX, performance, security — small teams can't staff it.<\u002Fspan><span class=\"ar\">الوظائف والتجربة والأداء والأمان — يصعب على الفرق الصغيرة توفيرها.<\u002Fspan><\u002Fp>\n      <\u002Fdiv>\n      <div class=\"reveal\" style=\"display:grid;grid-template-columns:minmax(56px,90px) 1fr 1.2fr;gap:20px;align-items:baseline;padding:26px 0;border-bottom:1px solid #E1E7F0\">\n        <span class=\"mono\" style=\"font-size:15px;color:#2E6BE6\">03<\u002Fspan>\n        <h3 style=\"margin:0;font-size:clamp(17px,2vw,21px);font-weight:700\"><span class=\"en\">Tools only <em>find<\u002Fem> issues<\u002Fspan><span class=\"ar\">الأدوات <em>تجد<\u002Fem> المشكلات فقط<\u002Fspan><\u002Fh3>\n        <p style=\"margin:0;font-size:15px;line-height:1.6;color:#5A6A85\"><span class=\"en\">Nothing closes the loop from find → fix → verify → ship.<\u002Fspan><span class=\"ar\">لا شيء يُغلق الحلقة من الاكتشاف إلى الإصلاح إلى التحقّق إلى الإطلاق.<\u002Fspan><\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"how\" style=\"scroll-margin-top:70px;background:#FFFFFF;border-block:1px solid #E1E7F0;background-image:linear-gradient(#F0F3F8 1px,transparent 1px),linear-gradient(90deg,#F0F3F8 1px,transparent 1px);background-size:64px 64px\">\n    <div style=\"max-width:1240px;margin:0 auto;padding:80px 24px\">\n      <div class=\"reveal\" style=\"margin-bottom:8px\"><span class=\"mono\" style=\"font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#2E6BE6\">02 — HOW IT WORKS<\u002Fspan><\u002Fdiv>\n      <h2 class=\"disp reveal\" style=\"margin:0 0 48px;font-size:clamp(30px,4.6vw,54px)\">\n        <span class=\"en\">A closed loop.<br>Not a checklist.<\u002Fspan>\n        <span class=\"ar\">حلقة مُغلقة. لا قائمة تحقّق.<\u002Fspan>\n      <\u002Fh2>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:56px;align-items:center\">\n        <div class=\"reveal\" style=\"display:flex;justify-content:center;padding:0 56px\">\n          <div style=\"position:relative;width:min(380px,62vw);aspect-ratio:1;margin:14px 0\">\n            <div style=\"position:absolute;inset:0;border:1.5px dashed #B9C6DD;border-radius:50%\"><\u002Fdiv>\n            <div aria-hidden=\"true\" style=\"position:absolute;inset:0;animation:spinOrbit 8.8s linear infinite\">\n              <span style=\"position:absolute;top:-8px;left:50%;margin-left:-8px;width:16px;height:16px;border-radius:50%;background:#2E6BE6;box-shadow:0 0 0 5px rgba(46,107,230,.18)\"><\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center\">\n              <img src=\"b5d470a9-0894-47d2-a121-e4454eb5ca30\" alt=\"\" style=\"width:84px;height:84px;border-radius:50%;border:1px solid #E1E7F0;box-shadow:0 10px 26px rgba(11,21,38,.14)\">\n              <div class=\"mono\" style=\"margin-top:10px;font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:#5A6A85\"><span class=\"en\">CLOSED LOOP<\u002Fspan><span class=\"ar\">حلقة مغلقة<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"position:absolute;top:0;left:50%;transform:translate(-50%,-50%);background:#fff;border:1px solid #D9E0EC;border-radius:100px;padding:7px 16px;font-weight:700;font-size:13.5px;box-shadow:0 4px 14px rgba(11,21,38,.08);white-space:nowrap\"><span class=\"mono\" style=\"color:#2E6BE6;font-size:11px\">01 <\u002Fspan><span class=\"en\">Discover<\u002Fspan><span class=\"ar\">اكتشاف<\u002Fspan><\u002Fdiv>\n            <div style=\"position:absolute;top:50%;left:100%;transform:translate(-50%,-50%);background:#fff;border:1px solid #D9E0EC;border-radius:100px;padding:7px 16px;font-weight:700;font-size:13.5px;box-shadow:0 4px 14px rgba(11,21,38,.08);white-space:nowrap\"><span class=\"mono\" style=\"color:#2E6BE6;font-size:11px\">02 <\u002Fspan><span class=\"en\">Fix<\u002Fspan><span class=\"ar\">إصلاح<\u002Fspan><\u002Fdiv>\n            <div style=\"position:absolute;top:100%;left:50%;transform:translate(-50%,-50%);background:#fff;border:1px solid #D9E0EC;border-radius:100px;padding:7px 16px;font-weight:700;font-size:13.5px;box-shadow:0 4px 14px rgba(11,21,38,.08);white-space:nowrap\"><span class=\"mono\" style=\"color:#2E6BE6;font-size:11px\">03 <\u002Fspan><span class=\"en\">Verify<\u002Fspan><span class=\"ar\">تحقّق<\u002Fspan><\u002Fdiv>\n            <div style=\"position:absolute;top:50%;left:0;transform:translate(-50%,-50%);background:#fff;border:1px solid #D9E0EC;border-radius:100px;padding:7px 16px;font-weight:700;font-size:13.5px;box-shadow:0 4px 14px rgba(11,21,38,.08);white-space:nowrap\"><span class=\"mono\" style=\"color:#2E6BE6;font-size:11px\">04 <\u002Fspan><span class=\"en\">Ship<\u002Fspan><span class=\"ar\">إطلاق<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:12px\">\n          <div class=\"reveal\" style=\"border:1px solid #E1E7F0;border-radius:12px;padding:18px 20px;display:flex;gap:16px;align-items:flex-start;animation:stageOn 8.8s infinite;animation-delay:0s\">\n            <span class=\"mono\" style=\"min-width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:8px;font-size:12px;font-weight:700;animation:stageNumOn 8.8s infinite;animation-delay:0s\">01<\u002Fspan>\n            <div><strong style=\"font-size:16px\"><span class=\"en\">Discover<\u002Fspan><span class=\"ar\">اكتشاف<\u002Fspan><\u002Fstrong><p style=\"margin:4px 0 0;font-size:14px;line-height:1.55;color:#5A6A85\"><span class=\"en\">Agents map your app and surface what's broken.<\u002Fspan><span class=\"ar\">يرسم الوكلاء تطبيقك ويكشفون ما هو معطّل.<\u002Fspan><\u002Fp><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"reveal\" style=\"border:1px solid #E1E7F0;border-radius:12px;padding:18px 20px;display:flex;gap:16px;align-items:flex-start;animation:stageOn 8.8s infinite;animation-delay:2.2s\">\n            <span class=\"mono\" style=\"min-width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:8px;font-size:12px;font-weight:700;animation:stageNumOn 8.8s infinite;animation-delay:2.2s\">02<\u002Fspan>\n            <div><strong style=\"font-size:16px\"><span class=\"en\">Fix<\u002Fspan><span class=\"ar\">إصلاح<\u002Fspan><\u002Fstrong><p style=\"margin:4px 0 0;font-size:14px;line-height:1.55;color:#5A6A85\"><span class=\"en\">They author the fix and open a reviewable PR.<\u002Fspan><span class=\"ar\">يكتبون الإصلاح ويفتحون طلب دمج قابلاً للمراجعة.<\u002Fspan><\u002Fp><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"reveal\" style=\"border:1px solid #E1E7F0;border-radius:12px;padding:18px 20px;display:flex;gap:16px;align-items:flex-start;animation:stageOn 8.8s infinite;animation-delay:4.4s\">\n            <span class=\"mono\" style=\"min-width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:8px;font-size:12px;font-weight:700;animation:stageNumOn 8.8s infinite;animation-delay:4.4s\">03<\u002Fspan>\n            <div><strong style=\"font-size:16px\"><span class=\"en\">Verify<\u002Fspan><span class=\"ar\">تحقّق<\u002Fspan><\u002Fstrong><p style=\"margin:4px 0 0;font-size:14px;line-height:1.55;color:#5A6A85\"><span class=\"en\">Re-tested and machine-checked into a receipt.<\u002Fspan><span class=\"ar\">يُعاد الاختبار ويُتحقَّق آلياً في إيصال.<\u002Fspan><\u002Fp><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"reveal\" style=\"border:1px solid #E1E7F0;border-radius:12px;padding:18px 20px;display:flex;gap:16px;align-items:flex-start;animation:stageOn 8.8s infinite;animation-delay:6.6s\">\n            <span class=\"mono\" style=\"min-width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:8px;font-size:12px;font-weight:700;animation:stageNumOn 8.8s infinite;animation-delay:6.6s\">04<\u002Fspan>\n            <div><strong style=\"font-size:16px\"><span class=\"en\">Ship<\u002Fspan><span class=\"ar\">إطلاق<\u002Fspan><\u002Fstrong><p style=\"margin:4px 0 0;font-size:14px;line-height:1.55;color:#5A6A85\"><span class=\"en\">Merged, deployed, and looped back for the next.<\u002Fspan><span class=\"ar\">يُدمج ويُنشر وتعود الحلقة للتالية.<\u002Fspan><\u002Fp><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"services\" style=\"max-width:1240px;margin:0 auto;padding:80px 24px;scroll-margin-top:70px\">\n    <div class=\"reveal\" style=\"margin-bottom:8px\"><span class=\"mono\" style=\"font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#2E6BE6\">03 — SERVICES<\u002Fspan><\u002Fdiv>\n    <h2 class=\"disp reveal\" style=\"margin:0 0 36px;font-size:clamp(30px,4.6vw,54px)\">\n      <span class=\"en\">Five agents. <span style=\"color:transparent;-webkit-text-stroke:1.5px #0B1526\">One QA team.<\u002Fspan><\u002Fspan>\n      <span class=\"ar\">خمسة وكلاء. <span style=\"color:#2E6BE6\">فريق جودة واحد.<\u002Fspan><\u002Fspan>\n    <\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px\">\n      <div class=\"reveal\" style=\"background:#FFFFFF;border:1px solid #E1E7F0;border-radius:14px;padding:26px;position:relative;transition:transform .22s,box-shadow .22s,border-color .22s\" style-hover=\"transform:translateY(-5px);box-shadow:0 16px 36px rgba(46,107,230,.16);border-color:#2E6BE6\">\n        <div class=\"mono\" style=\"font-size:12px;color:#B9C6DD;margin-bottom:44px\">/01<\u002Fdiv>\n        <h3 class=\"disp\" style=\"margin:0 0 8px;font-size:20px\">Sweep<\u002Fh3>\n        <p style=\"margin:0;font-size:14.5px;line-height:1.6;color:#5A6A85\"><span class=\"en\">A smart audit of your site from a single link.<\u002Fspan><span class=\"ar\">تدقيق ذكي لموقعك انطلاقاً من رابط واحد.<\u002Fspan><\u002Fp>\n      <\u002Fdiv>\n      <div class=\"reveal\" style=\"background:#FFFFFF;border:1px solid #E1E7F0;border-radius:14px;padding:26px;position:relative;transition:transform .22s,box-shadow .22s,border-color .22s\" style-hover=\"transform:translateY(-5px);box-shadow:0 16px 36px rgba(46,107,230,.16);border-color:#2E6BE6\">\n        <div class=\"mono\" style=\"font-size:12px;color:#B9C6DD;margin-bottom:44px\">/02<\u002Fdiv>\n        <h3 class=\"disp\" style=\"margin:0 0 8px;font-size:20px\">Journeys<\u002Fh3>\n        <p style=\"margin:0;font-size:14.5px;line-height:1.6;color:#5A6A85\"><span class=\"en\">Value · UX · performance · security, in one pass.<\u002Fspan><span class=\"ar\">القيمة · تجربة المستخدم · الأداء · الأمان في جولة واحدة.<\u002Fspan><\u002Fp>\n      <\u002Fdiv>\n      <div class=\"reveal\" style=\"background:#FFFFFF;border:1px solid #E1E7F0;border-radius:14px;padding:26px;position:relative;transition:transform .22s,box-shadow .22s,border-color .22s\" style-hover=\"transform:translateY(-5px);box-shadow:0 16px 36px rgba(46,107,230,.16);border-color:#2E6BE6\">\n        <div class=\"mono\" style=\"font-size:12px;color:#B9C6DD;margin-bottom:44px\">/03<\u002Fdiv>\n        <h3 class=\"disp\" style=\"margin:0 0 8px;font-size:20px\">Bug Testing<\u002Fh3>\n        <p style=\"margin:0;font-size:14.5px;line-height:1.6;color:#5A6A85\"><span class=\"en\">Evidence-backed re-testing with confidence scores.<\u002Fspan><span class=\"ar\">إعادة اختبار مدعومة بالأدلة مع مقاييس ثقة.<\u002Fspan><\u002Fp>\n      <\u002Fdiv>\n      <div class=\"reveal\" style=\"background:#FFFFFF;border:1px solid #E1E7F0;border-radius:14px;padding:26px;position:relative;transition:transform .22s,box-shadow .22s,border-color .22s\" style-hover=\"transform:translateY(-5px);box-shadow:0 16px 36px rgba(46,107,230,.16);border-color:#2E6BE6\">\n        <div class=\"mono\" style=\"font-size:12px;color:#B9C6DD;margin-bottom:44px\">/04<\u002Fdiv>\n        <h3 class=\"disp\" style=\"margin:0 0 8px;font-size:20px\">Bug Fixing<\u002Fh3>\n        <p style=\"margin:0;font-size:14.5px;line-height:1.6;color:#5A6A85\"><span class=\"en\">Autonomous fix → PR → merge → deploy → hand-off.<\u002Fspan><span class=\"ar\">إصلاح ذاتي: fix → PR → merge → deploy → تسليم.<\u002Fspan><\u002Fp>\n      <\u002Fdiv>\n      <div class=\"reveal\" style=\"background:#2E6BE6;border:1px solid #2E6BE6;border-radius:14px;padding:26px;position:relative;color:#fff;transition:transform .22s,box-shadow .22s\" style-hover=\"transform:translateY(-5px);box-shadow:0 16px 36px rgba(46,107,230,.4)\">\n        <div class=\"mono\" style=\"font-size:12px;color:rgba(255,255,255,.55);margin-bottom:44px\">/05<\u002Fdiv>\n        <h3 class=\"disp\" style=\"margin:0 0 8px;font-size:20px\">GenAI Evaluation<\u002Fh3>\n        <p style=\"margin:0;font-size:14.5px;line-height:1.6;color:#D9E5FB\"><span class=\"en\">Grades AI features against quality contracts.<\u002Fspan><span class=\"ar\">تقييم ميزات الذكاء الاصطناعي وفق عقود جودة.<\u002Fspan><\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"receipt\" style=\"scroll-margin-top:70px;background:#0B1526;color:#E6ECF7;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:64px 64px\">\n    <div style=\"max-width:1240px;margin:0 auto;padding:88px 24px\">\n      <div class=\"reveal\" style=\"margin-bottom:8px\"><span class=\"mono\" style=\"font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#6E9BF0\">04 — THE RECEIPT<\u002Fspan><\u002Fdiv>\n      <h2 class=\"disp reveal\" style=\"margin:0 0 14px;font-size:clamp(34px,5.4vw,68px);color:#fff\">\n        <span class=\"en\">Evidence, <span style=\"color:transparent;-webkit-text-stroke:1.5px #6E9BF0\">not claims.<\u002Fspan><\u002Fspan>\n        <span class=\"ar\">الأدلة، <span style=\"color:#6E9BF0\">لا الادعاءات.<\u002Fspan><\u002Fspan>\n      <\u002Fh2>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:56px;align-items:center;margin-top:30px\">\n        <div>\n          <p class=\"reveal\" style=\"margin:0 0 34px;font-size:16.5px;line-height:1.7;color:#9FB0CF;max-width:46ch\">\n            <span class=\"en\">Every verdict ships with a machine-checked receipt: what was tested, the result, the confidence, the timestamp. Proof you can hand to anyone.<\u002Fspan>\n            <span class=\"ar\">كل حكم يأتي بإيصال مُتحقَّق آلياً: ما جرى اختباره، والنتيجة، ودرجة الثقة، والطابع الزمني. دليل يمكنك تسليمه لأي شخص.<\u002Fspan>\n          <\u002Fp>\n          <div style=\"display:flex;flex-direction:column;gap:22px\">\n            <div class=\"reveal\" style=\"border-left:2px solid #2E6BE6;padding-left:18px\">\n              <strong style=\"font-size:16.5px;color:#fff\"><span class=\"en\">QA memory that compounds<\u002Fspan><span class=\"ar\">ذاكرة جودة تتراكم مع كل مشروع<\u002Fspan><\u002Fstrong>\n              <p style=\"margin:5px 0 0;font-size:14.5px;line-height:1.6;color:#9FB0CF\"><span class=\"en\">Dependency maps and re-tests grow smarter with every project.<\u0
